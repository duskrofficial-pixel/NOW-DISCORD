name: Android Build

# Run on every push to the default branch and on manual trigger
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout the repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Set up Node.js (the app uses Node 20)
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      # 3️⃣ Install npm dependencies
      - name: Install dependencies
        run: npm ci

      # 4️⃣ Add the Android platform (Capacitor)
      - name: Add Android platform
        run: npx cap add android

      # 5️⃣ Sync Capacitor (copies web assets into the native project)
      - name: Sync Capacitor
        run: npx cap sync android

      # 6️⃣ Build the debug APK
      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug

      # 7️⃣ Upload the APK as a downloadable artifact
      - name: Upload APK artifact
        uses: actions/upload-artifact@v3
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apkname: Android Build

